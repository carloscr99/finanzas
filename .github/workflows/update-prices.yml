name: Actualizar cotizaciones

on:
  schedule:
    # Dos pasadas al día. La de la tarde (18:00 UTC = 20:00 verano / 19:00 invierno, hora de Madrid) recoge el valor
    # liquidativo del día anterior, que los fondos publican a lo largo del día; la de la mañana (06:00 UTC) es un respaldo.
    # GitHub ejecuta el cron "cuando puede": puede retrasarse o saltarse alguna pasada.
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Obtener precios y actualizar prices.json
        run: node scripts/update-prices.mjs

      - name: Subir el cambio si hay precios nuevos
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- prices.json; then
            echo "prices.json sin cambios, no se hace commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add prices.json
            git commit -m "Cotizaciones $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # Los commits hechos con GITHUB_TOKEN no disparan el workflow de publicación: se llama aquí explícitamente.
  # Se le pasa el commit recién creado: si no, el workflow llamado descargaría el commit con el que arrancó esta
  # ejecución (github.sha) y publicaría el prices.json anterior.
  publicar:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
